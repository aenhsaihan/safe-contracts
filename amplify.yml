version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install --legacy-peer-deps
        # Check for amplify_outputs.json
        # Note: When Amplify Hosting detects an amplify/ folder, it should automatically
        # deploy the backend and generate amplify_outputs.json. If it doesn't exist,
        # you may need to commit it to the repository.
        - |
          if [ -f "amplify_outputs.json" ]; then
            echo "✓ Found amplify_outputs.json"
            # Ensure the file is readable and has content
            if [ ! -s "amplify_outputs.json" ]; then
              echo "⚠ Warning: amplify_outputs.json is empty"
            fi
          else
            echo "⚠ Warning: amplify_outputs.json not found"
            echo "Amplify Hosting should generate this automatically when it detects the amplify/ folder."
            echo "If the build fails, you may need to commit amplify_outputs.json to your repository."
            echo "The file contains endpoints (not secrets) and is safe to commit."
            exit 1
          fi
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*

