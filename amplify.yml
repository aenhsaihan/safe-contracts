version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install --legacy-peer-deps
        # Check for amplify_outputs.json
        # Note: When Amplify Hosting detects an amplify/ folder, it should automatically
        # deploy the backend and generate amplify_outputs.json. If it doesn't exist,
        # you may need to commit it to the repository.
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*

