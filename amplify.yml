version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install --legacy-peer-deps
        # Pull Amplify backend configuration
        # Amplify Hosting provides AMPLIFY_APP_ID and AMPLIFY_ENV_NAME automatically
        # If those aren't set, you can set them as environment variables in Amplify Hosting console
        - |
          if [ -n "$AMPLIFY_APP_ID" ] && [ -n "$AMPLIFY_ENV_NAME" ]; then
            echo "Pulling Amplify backend configuration..."
            npx ampx pull --appId $AMPLIFY_APP_ID --envName $AMPLIFY_ENV_NAME --yes
          elif [ -f "amplify_outputs.json" ]; then
            echo "Using existing amplify_outputs.json from repository"
          else
            echo "Error: amplify_outputs.json not found and AMPLIFY_APP_ID/AMPLIFY_ENV_NAME not set"
            echo "Either:"
            echo "  1. Set AMPLIFY_APP_ID and AMPLIFY_ENV_NAME in Amplify Hosting environment variables, OR"
            echo "  2. Commit amplify_outputs.json to your repository"
            exit 1
          fi
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*

